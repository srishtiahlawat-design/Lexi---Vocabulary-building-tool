<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lexi</title>
    <style>
      @font-face { font-family: "Lexi Klee One"; src: url("fonts/KleeOne-SemiBold.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Lexi Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 400 600; }
      :root {
        --paper: #F7F3EA; --page: #E9E4D6; --off: #FFFDF8; --border: #D8D3C9; --ink: #171717; --ink-2: #45423E; --muted: #66615A;
        --rule: rgba(110, 155, 215, 0.3); --margin: rgba(214, 100, 96, 0.42); --outline: #B3AC9E; --success: #4F7053; --error: #A33333;
        --serif: "Lexi Klee One", "Klee One", Georgia, serif; --sans: "Lexi Geist", "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px;
        background: var(--page); color: var(--ink); font-family: var(--sans); }
      .card { position: relative; width: 100%; max-width: 560px; padding: 0 40px 40px 72px; background: var(--paper);
        border: 1px solid var(--border); border-radius: 13px; box-shadow: 0 24px 60px rgba(0,0,0,0.14); overflow: hidden; }
      .card::after { content: ""; position: absolute; top: 0; bottom: 0; left: 40px; width: 1px; background: var(--margin); pointer-events: none; }
      .card > * { position: relative; z-index: 1; }
      header { height: 76px; margin: 0 -40px 0 -72px; padding: 0 40px 0 72px; display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
      h1 { margin: 0; font: 600 20px/26px var(--serif); }
      p.intro { margin: 20px 0 0; max-width: 420px; font-size: 15px; line-height: 23px; color: var(--ink-2); }
      .field { position: relative; margin-top: 22px; }
      .field:first-of-type { margin-top: 28px; }
      label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .box { position: relative; margin-top: 8px; height: 46px; background: var(--off); border-radius: 10px; }
      .box svg.outline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .box input, .box select { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0 14px; font: inherit; font-size: 15px; color: var(--ink);
        background: none; border: none; outline: none; appearance: none; -webkit-appearance: none; }
      .box select { padding-right: 40px; cursor: pointer; }
      .box input::placeholder { color: #9A948A; }
      .box .chev { position: absolute; right: 14px; top: 14px; pointer-events: none; }
      .box:focus-within { box-shadow: 0 0 0 2px rgba(69,66,62,0.25); }
      .row { margin-top: 28px; display: flex; align-items: center; gap: 16px; }
      button { height: 44px; padding: 0 34px; font: inherit; font-size: 14px; font-weight: 400; color: var(--ink-2); background: var(--off); cursor: pointer;
        border: 1.5px solid var(--border); border-radius: 14px; box-shadow: 0 8px 14px -8px rgba(60,50,40,0.30);
        transition: border-color 160ms ease, box-shadow 160ms ease, color 160ms ease; }
      button:hover { color: var(--ink); border-color: var(--ink-2); box-shadow: inset 0 0 0 0.5px var(--ink-2), 0 8px 14px -8px rgba(60,50,40,0.30); }
      #status { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; opacity: 0; transform: translateY(4px); pointer-events: none;
        transition: opacity 200ms ease, transform 200ms ease; }
      #status.show { opacity: 1; transform: none; }
      #status.ok { color: var(--success); }
      #status.err { color: var(--error); }
      #status svg { flex: none; }
      @media (prefers-reduced-motion: reduce) { #status, button { transition: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <header><h1>Lexi</h1></header>
      <p class="intro">Pick a model provider and paste its API key. The key is stored only on this device and is never synced.</p>
      <div class="field">
        <label for="provider">Provider</label>
        <div class="box" id="providerBox"><select id="provider"></select>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66615A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg></div>
      </div>
      <div class="field">
        <label for="apiKey">API key</label>
        <div class="box" id="keyBox"><input id="apiKey" type="password" placeholder="" autocomplete="off" /></div>
      </div>
      <div class="row">
        <button id="save" type="button">Save</button>
        <div id="status" role="status"></div>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
